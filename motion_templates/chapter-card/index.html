<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"label","type":"string","label":"Label","default":"Day 1"},
  {"id":"place","type":"string","label":"Place","default":"Kraków"},
  {"id":"accent","type":"color","label":"Accent","default":"#FFD400"},
  {"id":"bg_from","type":"color","label":"Background 1","default":"#1B1034"},
  {"id":"bg_to","type":"color","label":"Background 2","default":"#E4457A"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=__W__, height=__H__" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;800;900&display=block" />
<link rel="stylesheet" href="base.css" />
<script src="gsap.min.js"></script>
<style>
  :root { --accent: #FFD400; --bg1: #1B1034; --bg2: #E4457A; }
  #root { width: __W__px; height: __H__px; }
  #cc-bg { background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%); }
  #cc-ring { display: flex; align-items: center; justify-content: center; }
  #cc-ring i { position: absolute; border-radius: 50%; border: calc(var(--u) * .7) solid rgba(255,255,255,.22); width: calc(var(--u) * 70); height: calc(var(--u) * 70); }
  #cc-content { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 calc(var(--u) * 8); box-sizing: border-box; width: 100%; height: 100%; }
  #cc-label { font-weight: 800; font-size: calc(var(--u) * 6); letter-spacing: .3em; text-transform: uppercase; color: var(--accent); margin: 0; }
  #cc-line { width: calc(var(--u) * 16); height: calc(var(--u) * .9); background: var(--accent); margin: calc(var(--u) * 3.2) 0; border-radius: 99px; transform-origin: center; }
  #cc-place { font-weight: 900; font-size: calc(var(--u) * 17); line-height: 1.02; margin: 0; text-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 4) rgba(0,0,0,.35); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="__W__" data-height="__H__" data-duration="__DUR__">
  <div id="cc-bg" class="layer clip" data-start="0" data-duration="__DUR__" data-track-index="0"></div>
  <div id="cc-ring" class="layer clip" data-start="0" data-duration="__DUR__" data-track-index="1"><i></i></div>
  <div id="cc-layer" class="layer clip" data-start="0" data-duration="__DUR__" data-track-index="2">
    <div id="cc-content">
      <p id="cc-label"></p>
      <div id="cc-line"></div>
      <h1 id="cc-place"></h1>
    </div>
  </div>
</div>
<script src="motion-kit.js"></script>
<script>
  const v = MK.vars, D = MK.D;
  MK.colors({ "--accent": v.accent, "--bg1": v.bg_from, "--bg2": v.bg_to });
  MK.text(document.getElementById("cc-label"), v.label);
  const ws = MK.words(document.getElementById("cc-place"), v.place);
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#cc-bg", { scale: 1.2 }, { scale: 1, duration: D, ease: "none" }, 0)
    .fromTo("#cc-ring i", { scale: 0.3, opacity: 0 }, { scale: 1.4, opacity: 1, duration: 1.4, ease: "power2.out" }, 0)
    .to("#cc-ring i", { opacity: 0, duration: 0.6, ease: "power1.in" }, 1.0)
    .fromTo("#cc-label", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.1)
    .fromTo("#cc-line", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.4)
    .fromTo(ws, { yPercent: 115, rotation: 6 }, { yPercent: 0, rotation: 0, duration: 0.7, ease: "back.out(1.6)", stagger: 0.1 }, 0.6)
    .to("#cc-content", { scale: 1.05, duration: D - 1.1, ease: "none" }, 0.9)
    .to("#cc-content", { opacity: 0, y: -40, duration: 0.35, ease: "power2.in" }, D - 0.35);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
