<script src="motion-kit.js"></script>
<script>
  const GEO = /*GEO*/null/*END*/;
  const v = MK.vars, D = MK.D;
  MK.colors({ "--accent": v.accent, "--bg1": v.bg_from, "--bg2": v.bg_to });
  const $ = (id) => document.getElementById(id), NS = "http://www.w3.org/2000/svg";
  $("mr-land").setAttribute("d", GEO.land); $("mr-poland").setAttribute("d", GEO.poland); $("mr-borders").setAttribute("d", GEO.borders);
  const P = GEO.proj, rad = Math.PI / 180, merc = (f) => Math.log(Math.tan(Math.PI / 4 + f * rad / 2));

  const car = mk("g", {}); mk("circle", { r: 34, fill: "rgba(255,212,0,.35)" }, car); mk("circle", { r: 20, fill: "#fff", stroke: "#0b1f3a", "stroke-width": 7 }, car);
