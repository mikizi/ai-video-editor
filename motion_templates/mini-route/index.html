  else { for (let i = 1; i < tp.length - 1; i++) { const m = [(tp[i][0] + tp[i + 1][0]) / 2, (tp[i][1] + tp[i + 1][1]) / 2]; d += ` Q${tp[i][0]} ${tp[i][1]} ${i === tp.length - 2 ? tp[i + 1][0] : m[0]} ${i === tp.length - 2 ? tp[i + 1][1] : m[1]}`; } }
  mk("path", { d, fill: "none", stroke: "rgba(255,255,255,.35)", "stroke-width": 8, "stroke-dasharray": "4 22", "stroke-linecap": "round" });
  const WALK = String(v.walk) === "1";
  const route = mk("path", { d, fill: "none", stroke: WALK ? "#6fe3ff" : "#FFD400", "stroke-width": 14, "stroke-linecap": "round" });
  const L = route.getTotalLength(); route.style.strokeDasharray = L; route.style.strokeDashoffset = L;
  const pin = (p, he, en, up) => { const g = mk("g", { transform: `translate(${p[0]} ${p[1]})` }); mk("circle", { r: 26, fill: "#FFD400", stroke: "#0b1f3a", "stroke-width": 8 }, g);
    const h = mk("text", { x: 0, y: up ? -62 : 86, "text-anchor": "middle", class: "lb-he" }, g); h.textContent = he; const e = mk("text", { x: 0, y: up ? -18 : 130, "text-anchor": "middle", class: "lb-en" }, g); e.textContent = en; return g; };
  const a = tp[0], b = tp[tp.length - 1], aUp = a[1] < b[1];   // the label of the higher stop goes above it, the lower one below it
  const pa = pin(a, v.from_he, v.from_en, aUp), pb = pin(b, v.to_he, v.to_en, !aUp);
  const car = mk("g", {}); mk("circle", { r: 34, fill: "rgba(255,212,0,.35)" }, car); mk("circle", { r: 20, fill: "#fff", stroke: "#0b1f3a", "stroke-width": 7 }, car);
  MK.text($("mr-chip"), v.info); $("mr-chip").dir = "rtl";
  const prog = { p: 0 };
  const TOT = parseFloat(v.total_km) || 0;
  const place = (p) => { const q = L * p, pt = route.getPointAtLength(q); car.setAttribute("transform", `translate(${pt.x} ${pt.y})`); route.style.strokeDashoffset = L * (1 - p);
    if (TOT) { const left = Math.max(0, TOT * (1 - p)); $("mr-chip").textContent = left < 0.05 ? "הגענו! 🎉" : `נשארו ${left.toFixed(1)} ק״מ`; } };
  place(0);
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#mr-z", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0)
    .fromTo(pa, { opacity: 0, scale: .3, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.2)
    .fromTo(prog, { p: 0 }, { p: 1, duration: D - 1.6, ease: "none", onUpdate: () => place(prog.p) }, 0.7)
    .fromTo(pb, { opacity: 0, scale: .3, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.5)
    .fromTo("#mr-chip", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.9);
  window.__timelines["main"] = tl;
</script>
