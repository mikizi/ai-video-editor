<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"The End"},
  {"id":"subtitle","type":"string","label":"Subtitle","default":"Until the next trip"},
  {"id":"accent","type":"color","label":"Accent","default":"#FFD400"},
  {"id":"bg_from","type":"color","label":"Background 1","default":"#0B0B12"},
  {"id":"bg_to","type":"color","label":"Background 2","default":"#26204A"}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=__W__, height=__H__" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;800;900&display=block" />
<link rel="stylesheet" href="base.css" />
<script src="gsap.min.js"></script>
<style>
  :root { --accent: #FFD400; --bg1: #0B0B12; --bg2: #26204A; }
  #root { width: __W__px; height: __H__px; }
  #ou-bg { background: radial-gradient(circle at 50% 40%, var(--bg2) 0%, var(--bg1) 75%); }
  #ou-dots i { position: absolute; border-radius: 50%; background: var(--accent); opacity: 0; }
  #ou-content { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 calc(var(--u) * 8); box-sizing: border-box; width: 100%; height: 100%; }
  #ou-title { font-weight: 900; font-size: calc(var(--u) * 16); line-height: 1.02; margin: 0; }
  #ou-bar { width: calc(var(--u) * 20); height: calc(var(--u) * 1.2); border-radius: 99px; background: var(--accent); margin: calc(var(--u) * 4) 0 calc(var(--u) * 3); transform-origin: center; }
  #ou-sub { font-weight: 500; font-size: calc(var(--u) * 5); letter-spacing: .06em; opacity: .9; margin: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="__W__" data-height="__H__" data-duration="__DUR__">
  <div id="ou-bg" class="layer clip" data-start="0" data-duration="__DUR__" data-track-index="0"></div>
  <div id="ou-dots" class="layer clip" data-start="0" data-duration="__DUR__" data-track-index="1"></div>
  <div id="ou-layer" class="layer clip" data-start="0" data-duration="__DUR__" data-track-index="2">
    <div id="ou-content">
      <h1 id="ou-title"></h1>
      <div id="ou-bar"></div>
      <p id="ou-sub"></p>
    </div>
  </div>
</div>
<script src="motion-kit.js"></script>
<script>
  const v = MK.vars, D = MK.D;
  MK.colors({ "--accent": v.accent, "--bg1": v.bg_from, "--bg2": v.bg_to });
  const ws = MK.words(document.getElementById("ou-title"), v.title);
  MK.text(document.getElementById("ou-sub"), v.subtitle);
  // Fixed (not random) confetti dots so every render is identical.
  const dots = document.getElementById("ou-dots");
  for (let i = 0; i < 18; i++) {
    const d = document.createElement("i");
    const s = MK.W * (0.012 + ((i * 37) % 7) * 0.004);
    d.style.width = d.style.height = s + "px";
    d.style.left = ((i * 53 + 11) % 100) + "%";
    d.style.top = ((i * 29 + 7) % 100) + "%";
    dots.appendChild(d);
  }
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#ou-bg", { scale: 1.3 }, { scale: 1, duration: D, ease: "none" }, 0)
    .fromTo("#ou-dots i", { opacity: 0, y: 60, scale: 0.2 }, { opacity: 0.8, y: -60, scale: 1, duration: 1.6, ease: "power2.out", stagger: 0.05 }, 0.2)
    .to("#ou-dots i", { opacity: 0, duration: 0.8 }, D - 1.2)
    .fromTo(ws, { scale: 0, rotation: -8 }, { scale: 1, rotation: 0, duration: 0.8, ease: "elastic.out(1, 0.6)", stagger: 0.12 }, 0.2)
    .fromTo("#ou-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.8)
    .fromTo("#ou-sub", { y: 30, opacity: 0 }, { y: 0, opacity: 0.9, duration: 0.7, ease: "power3.out" }, 1.0)
    .to("#ou-content", { scale: 1.05, duration: D - 1.5, ease: "none" }, 1.0)
    .to("#ou-content", { opacity: 0, duration: 0.8, ease: "power1.in" }, D - 0.8);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
