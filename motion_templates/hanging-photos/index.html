<script>
  const v = MK.vars, D = MK.D, W = MK.W, H = MK.H, u = Math.min(W, H) / 100, land = W >= H;

  const n = Math.max(items.length, 1);
  // one string for up to 4 photos; more than that and a second string hangs lower, so the same slide keeps filling up
  const ROWS = n > 4 ? 2 : 1, r1 = ROWS === 2 ? Math.ceil(n / 2) : n, r2 = n - r1;

  const bulbs = [], bulbRow = [];
