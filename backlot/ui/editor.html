<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutsmith</title>
<link rel="stylesheet" href="/ui/editor/editor.css">
</head>
<body>
<header id="top">
  <a class="logo" href="/" title="Cutsmith: back to all projects"><img src="/ui/editor/cutsmith-logo.png" alt="Cutsmith"></a>
  <select id="projSwitch" title="Switch project"></select>
  <div class="title hidden" id="title">Montage</div>
  <div class="tools">
    <button id="undo" title="Undo (⌘Z)">↶</button>
    <button id="redo" title="Redo (⇧⌘Z)">↷</button>
    <span class="save" id="save">—</span>
  </div>
  <div class="actions">
    <button id="binBtn" class="ghost" title="Show or hide the media bin (M)">📁 Media</button>
    <button id="aiBtn" class="ghost" title="Ask the AI to edit the selected clips">✨ AI chat</button>
    <span id="renderStatus" class="render-status"></span>
    <button id="previewBtn" class="ghost">Preview render</button>
    <button id="dlBtn" class="primary" title="Download the selected clip(s) with your edits, or the whole video if nothing is selected. No export needed. Hard cuts, no transitions or zoom.">⬇ Download</button>
    <div class="menu-wrap">
      <button class="menu-btn ghost" title="More">⋮</button>
      <div class="menu hidden">
        <button id="boardBtn" title="Inspiration board: screenshots, example videos and your own rules for the AI to learn from">✦ Inspiration</button>
        <button id="sndBtn" title="Sound: close-up of the clip sound, music and other channels with volume keyframes">🎚 Sound</button>
        <button id="inspBtn" title="Show or hide the settings of the selected item (I). Double-click a clip to open it">⚙ Settings</button>
        <button id="verBtn" title="Saved versions: go back to any earlier state">🕘 Versions</button>
        <button id="keysBtn" title="Choose your own keyboard shortcuts">⌨ Keys</button>
        <button id="stillBtn" title="Download the picture at the playhead as an image (PNG)">📷 Still image</button>
        <button id="exportBtn" title="Full export with transitions and motion (needs the Remotion renderer)">Export MP4 (full)</button>
        <a class="mi" id="back" href="/" title="Pipeline board for this project">Board</a>
      </div>
    </div>
  </div>
</header>
<div id="banner" class="banner hidden"></div>
<main id="main">
  <div id="binGrip" class="grip hidden" title="Drag to make the media panel wider"></div>
  <aside id="bin">
    <div class="bin-tabs" id="binTabs"></div>
    <input id="binSearch" class="bin-search hidden" type="search" placeholder="Search clips or transcripts...">
    <div id="binFolder"></div>
    <div class="bin-grid" id="binGrid"></div>
  </aside>
  <section id="stage">
    <div id="playerBox"><div id="player"></div><div id="rulers" class="rulers"></div><div id="xform" class="xform hidden"></div></div>
    <div class="transport">
      <button id="prevClip" title="Previous clip">⏮</button>
      <button id="play" class="play" title="Play / pause (space)">▶</button>
      <button id="nextClip" title="Next clip">⏭</button>
      <button id="fsBtn" title="Watch full screen (live, no render). Esc to exit">⛶</button>
      <span class="time" id="time">0:00.0 / 0:00.0</span>
      <button id="rulerBtn" title="Pixel rulers: real video pixels, to check placement">📏</button>
      <span class="px" id="pxRead"></span>
      <span class="db" id="dbRead"></span>
    </div>
  </section>
  <aside id="inspector"></aside>
  <aside id="comments" class="hidden"></aside>
  <aside id="sound" class="hidden"></aside>
  <aside id="chat" class="hidden"></aside>
</main>
<footer id="timeline">
  <div class="tl-toolbar">
    <button id="splitBtn" title="Split clip at playhead (S)">✂ Split</button>
    <button id="cropBtn" title="Crop the picture: drag the white squares on the preview">⛶ Crop</button>
    <button id="dupBtn" title="Duplicate the selected clip (placed right after it)">⧉ Duplicate</button>
    <button id="delBtn" title="Delete (⌫)">🗑 Delete</button>
    <button id="addText" title="Add text at playhead">T+ Text</button>
    <div class="menu-wrap">
      <button class="menu-btn" title="More clip tools">⋮ Tools</button>
      <div class="menu hidden">
        <button id="flipBtn" title="Mirror the picture left to right (shift-click: upside down)">⇋ Flip</button>
        <button id="rotBtn" title="Turn the picture 90 degrees">⟳ Rotate</button>
        <button id="expandBtn" title="Give back the part that was cut away: the clip grows to where it was cut from (or to the whole video)">⤢ Expand to the cut</button>
        <button id="revBtn" title="Play the clip backwards (click again to undo)">⏪ Reverse</button>
        <button id="cmtBtn" title="Review notes pinned to the timeline (C = add a note at the playhead)">💬 Notes</button>
        <button id="groupBtn" title="Group clips into one compound clip: click a clip, then shift-click the last clip of the range">▣ Group</button>
      </div>
    </div>
    <span class="grow"></span>
    <label class="zoom">Zoom <input id="zoom" type="range" min="20" max="320" value="90"></label>
  </div>
  <div class="tl-body">
    <div class="tl-labels">
      <div class="lab ruler-lab"></div>
      <div class="lab l-v" data-track="v3" title="Video 3"></div>
      <div class="lab l-v" data-track="v2" title="Video 2"></div>
      <div class="lab grp-lab" title="Compound clips"></div>
      <div class="lab l-v1" data-track="v1" title="Video 1"></div>
      <div class="lab l-tx" title="Text"></div>
      <div class="lab l-m" data-track="m1" title="Music 1"></div>
      <div class="lab l-m" data-track="m2" title="Music 2"></div>
      <div class="lab l-m" data-track="m3" title="Music 3"></div>
      <div class="lab l-nt" title="Notes"></div>
    </div>
    <div class="tl-scroll" id="tlScroll">
      <div class="tl-inner" id="tlInner">
        <div class="ruler" id="ruler"></div>
        <div class="track vlane" id="trackV3"></div>
        <div class="track vlane" id="trackV2"></div>
        <div class="track group" id="trackGroup"></div>
        <div class="track video" id="trackVideo"></div>
        <div class="track text" id="trackText"></div>
        <div class="track music" id="trackMusic"></div>
        <div class="track music" id="trackMusic2"></div>
        <div class="track music" id="trackMusic3"></div>
        <div class="track notes" id="trackNotes"></div>
        <div class="playhead" id="playhead"><div class="ph-knob"></div><div class="ph-time" id="phTime"></div></div>
      </div>
    </div>
  </div>
</footer>
<div id="empty" class="empty hidden">
  <div class="empty-card">
    <h2>No timeline yet</h2>
    <p id="emptyCount">Add photos and videos, then make a first draft.</p>
    <div class="row"><button id="emptyImport">＋ Import media</button></div>
    <div class="row">
      <select id="emptyAspect"><option>9:16</option><option>16:9</option><option>1:1</option><option>4:5</option></select>
      <button id="emptyDraft" class="primary">Create first draft</button>
    </div>
    <div class="row"><button id="emptyBlank" title="Open the editor with nothing on the timeline. Add videos from the media bin or the AI chat later.">Start empty (no video yet)</button></div>
    <p class="err" id="emptyErr"></p>
  </div>
</div>
<div id="versions" class="versions hidden"></div>
<div id="importer" class="importer hidden"></div>
<div id="toast" class="toast"></div>
<script src="/ui/editor/montage-player.js"></script>
<script type="module" src="/ui/editor/editor.js"></script>
</body>
</html>
